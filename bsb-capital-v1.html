<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSB Capital - Crypto Analysis Platform</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2234;
  --bg-card-hover: #1f2b42;
  --border: #2a3550;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.15);
  --green: #10b981;
  --green-bg: rgba(16,185,129,0.12);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.12);
  --yellow: #f59e0b;
  --yellow-bg: rgba(245,158,11,0.12);
  --cyan: #06b6d4;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
.top-bar {
  background: linear-gradient(135deg, var(--bg-secondary) 0%, #0f1729 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px; position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  display: flex; align-items: center; gap: 12px;
  font-weight: 700; font-size: 18px; letter-spacing: 1px;
}
.logo-icon {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--cyan));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px; color: white;
}
.logo span { color: var(--accent); }
.badge {
  font-size: 10px; background: var(--accent-glow); color: var(--accent);
  padding: 3px 8px; border-radius: 6px; font-weight: 600;
  border: 1px solid rgba(59,130,246,0.3);
}
.top-right { display: flex; align-items: center; gap: 12px; }
.token-selector { display: flex; gap: 8px; align-items: center; }
.token-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); padding: 8px 20px; border-radius: 8px;
  cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s;
  letter-spacing: 0.5px;
}
.token-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--accent); }
.token-btn.active {
  background: var(--accent-glow); color: var(--accent);
  border-color: var(--accent); box-shadow: 0 0 20px rgba(59,130,246,0.15);
}

/* View toggle */
.view-toggle { display: flex; gap: 4px; background: var(--bg-card); border-radius: 8px; padding: 3px; border: 1px solid var(--border); }
.view-btn {
  background: transparent; border: none; color: var(--text-muted); padding: 6px 16px;
  border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.2s;
}
.view-btn:hover { color: var(--text-primary); }
.view-btn.active { background: var(--accent); color: white; }

.container { max-width: 1440px; margin: 0 auto; padding: 24px 32px; }

.loading {
  display: none; position: fixed; inset: 0; background: rgba(10,14,23,0.85);
  z-index: 200; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.loading.active { display: flex; }
.spinner {
  width: 48px; height: 48px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Verdict Banner */
.verdict-banner {
  border-radius: 16px; padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.verdict-banner::before {
  content: ''; position: absolute; inset: 0; opacity: 0.06;
  background: radial-gradient(ellipse at 30% 50%, currentColor, transparent 70%);
}
.verdict-left { display: flex; align-items: center; gap: 24px; z-index: 1; }
.token-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--bg-secondary); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; color: var(--accent);
}
.token-info h1 { font-size: 28px; font-weight: 700; line-height: 1.2; }
.token-info .sub { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.verdict-right { text-align: right; z-index: 1; }
.verdict-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
.verdict-value { font-size: 32px; font-weight: 800; margin-top: 4px; }
.verdict-score { font-size: 14px; margin-top: 2px; }

/* Grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.span-2 { grid-column: span 2; }

/* Cards */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px; transition: border-color 0.2s;
}
.card:hover { border-color: rgba(59,130,246,0.3); }
.card-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted); font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .dot { width: 6px; height: 6px; border-radius: 50%; }

/* Metric boxes */
.metric-box { text-align: center; }
.metric-value { font-size: 28px; font-weight: 800; line-height: 1; }
.metric-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.metric-sub { font-size: 13px; margin-top: 4px; font-weight: 600; }

/* Score ring */
.score-ring-container { display: flex; align-items: center; justify-content: center; }
.score-ring { position: relative; width: 140px; height: 140px; }
.score-ring svg { transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.score-ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-ring-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.score-ring-value { font-size: 32px; font-weight: 800; }
.score-ring-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

/* Score bars */
.score-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.score-bar-label { width: 100px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
.score-bar-track { flex: 1; height: 8px; background: var(--bg-primary); border-radius: 4px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.score-bar-value { width: 45px; text-align: right; font-size: 13px; font-weight: 700; }

/* Donut chart */
.donut-container { display: flex; align-items: center; gap: 24px; }
.donut-legend { flex: 1; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-pct { margin-left: auto; font-weight: 700; color: var(--text-primary); }

/* Flags */
.flag-list { max-height: 300px; overflow-y: auto; }
.flag-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
  font-size: 13px; line-height: 1.5;
}
.flag-item.red { background: var(--red-bg); }
.flag-item.yellow { background: var(--yellow-bg); }
.flag-item.green { background: var(--green-bg); }
.flag-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
.flag-cat { font-weight: 700; margin-right: 4px; }

/* Indicator grid */
.indicator-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid rgba(42,53,80,0.5);
}
.indicator-row:last-child { border-bottom: none; }
.ind-name { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.ind-value { font-size: 14px; font-weight: 700; }
.ind-signal { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }

/* Price changes */
.positive { color: var(--green); }
.negative { color: var(--red); }
.neutral-c { color: var(--yellow); }

/* Structural */
.structural-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.structural-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-radius: 10px; background: var(--bg-primary);
  font-size: 13px;
}
.struct-label { color: var(--text-secondary); font-weight: 600; }
.struct-val { font-weight: 800; font-size: 14px; }

/* Market stat cards */
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; text-align: left;
}
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.stat-value { font-size: 22px; font-weight: 800; margin-top: 6px; }
.stat-sub { font-size: 12px; margin-top: 4px; font-weight: 600; }

/* Chart card */
.chart-wrapper { position: relative; height: 260px; }

/* Dimension scores (spider-like) */
.dim-score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.dim-label { width: 120px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
.dim-dots { display: flex; gap: 4px; }
.dim-dot { width: 24px; height: 8px; border-radius: 4px; background: var(--bg-primary); }
.dim-dot.filled { background: var(--accent); }
.dim-dot.filled.high { background: var(--green); }
.dim-dot.filled.mid { background: var(--yellow); }
.dim-dot.filled.low { background: var(--red); }
.dim-val { font-size: 13px; font-weight: 700; width: 30px; text-align: right; }

/* Memo styles */
.memo-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 32px; margin-bottom: 20px;
}
.memo-section-title {
  font-size: 16px; font-weight: 800; color: var(--accent);
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.memo-text { font-size: 14px; line-height: 1.8; color: var(--text-secondary); }
.memo-text strong { color: var(--text-primary); }
.memo-list { list-style: none; padding: 0; }
.memo-list li {
  padding: 8px 0; border-bottom: 1px solid rgba(42,53,80,0.3);
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
}
.memo-list li:last-child { border-bottom: none; }
.memo-list li::before { content: ''; margin-right: 8px; }
.memo-kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(42,53,80,0.3); }
.memo-kv:last-child { border-bottom: none; }
.memo-key { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.memo-val { font-size: 13px; font-weight: 700; }
.scenario-card {
  background: var(--bg-primary); border-radius: 12px; padding: 20px;
  border: 1px solid var(--border);
}
.scenario-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
.scenario-card .sc-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.glossary-term { font-weight: 800; color: var(--accent); font-size: 13px; }
.glossary-def { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }

/* Disclaimer */
.disclaimer {
  text-align: center; color: var(--text-muted); font-size: 12px;
  padding: 24px 0; border-top: 1px solid var(--border); margin-top: 32px;
}

/* Responsive */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .container { padding: 16px; }
  .top-bar { padding: 0 16px; flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 8px; }
  .token-selector { flex-wrap: wrap; }
  .verdict-banner { flex-direction: column; text-align: center; gap: 16px; }
  .verdict-right { text-align: center; }
}
</style>
</head>

<script>
let priceChart = null;
let distChart = null;
let currentView = 'dashboard';
let currentData = null;
let currentMemo = null;
let currentToken = null;

function switchView(view) {
  currentView = view;
  document.getElementById('viewDashboard').classList.toggle('active', view === 'dashboard');
  document.getElementById('viewMemo').classList.toggle('active', view === 'memo');
  if (view === 'memo' && currentToken && !currentMemo) {
    loadMemo(currentToken);
  } else if (view === 'memo' && currentMemo) {
    renderMemo(currentMemo, currentData);
  } else if (view === 'dashboard' && currentData) {
    renderDashboard(currentData);
  }
}

function loadToken(key) {
  currentToken = key;
  currentMemo = null;
  document.querySelectorAll('.token-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-token="${key}"]`).classList.add('active');
  document.getElementById('loading').classList.add('active');

  // Use embedded data instead of fetch
  currentData = EMBEDDED_DATA.analysis[key];
  if (currentView === 'dashboard') {
    renderDashboard(currentData);
  } else {
    loadMemo(key);
    return;
  }
  document.getElementById('loading').classList.remove('active');
}

function loadMemo(key) {
  document.getElementById('loading').classList.add('active');
  // Use embedded data instead of fetch
  currentMemo = EMBEDDED_DATA.memos[key];
  renderMemo(currentMemo, currentData);
  document.getElementById('loading').classList.remove('active');
}

function getVerdictColor(verdict) {
  if (verdict.includes('Alcista')) return 'var(--green)';
  if (verdict.includes('Bajista')) return 'var(--red)';
  return 'var(--yellow)';
}

function getScoreColor(score) {
  if (score >= 65) return 'var(--green)';
  if (score >= 45) return 'var(--yellow)';
  return 'var(--red)';
}

function chgClass(v) { return v >= 0 ? 'positive' : 'negative'; }
function chgStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

function scoreRingSVG(score, color) {
  const r = 58, c = 2 * Math.PI * r;
  const offset = c - (score / 100) * c;
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${r}" class="score-ring-bg"/>
    <circle cx="70" cy="70" r="${r}" class="score-ring-fill" stroke="${color}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

function dimScoreRow(label, score, max) {
  max = max || 5;
  let dots = '';
  for (let i = 1; i <= max; i++) {
    const filled = i <= Math.round(score);
    const cls = score >= 4 ? 'high' : score >= 3 ? 'mid' : 'low';
    dots += `<div class="dim-dot ${filled ? 'filled ' + cls : ''}"></div>`;
  }
  return `<div class="dim-score-row">
    <div class="dim-label">${label}</div>
    <div class="dim-dots">${dots}</div>
    <div class="dim-val">${score.toFixed(1)}</div>
  </div>`;
}

function velocityBadge(risk) {
  const colors = { low: 'green', medium: 'yellow', high: 'red', critical: 'red' };
  const labels = { low: 'Bajo', medium: 'Medio', high: 'Alto', critical: 'Critico' };
  const c = colors[risk] || 'yellow';
  return `<span class="ind-signal" style="background:var(--${c}-bg);color:var(--${c})">${labels[risk] || risk}</span>`;
}

function renderDashboard(d) {
  const vc = getVerdictColor(d.scores.verdict);
  const vs = d.scores.final;
  const adv = d.advanced_scores;
  const ac = getScoreColor(adv.composite);

  let html = `
  <!-- VERDICT BANNER -->
  <div class="verdict-banner" style="color:${vc}; background: var(--bg-card);">
    <div class="verdict-left">
      <div class="token-icon">${d.token.symbol}</div>
      <div class="token-info">
        <h1>${d.token.name} <span style="color:var(--text-muted);font-size:16px">${d.token.symbol}</span></h1>
        <div class="sub">${d.token.type} &middot; Precio: ${d.token.price} &middot; <span class="${chgClass(d.token.change_24h)}">${chgStr(d.token.change_24h)} 24h</span></div>
      </div>
    </div>
    <div class="verdict-right">

function renderMemo(memo, dashData) {
  const m = memo.metadata;
  const vc = getVerdictColor(m.verdict);
  const sc = getScoreColor(m.composite_score);
  const ss = memo.scoring_summary;

  let html = `
  <!-- MEMO HEADER -->
  <div class="verdict-banner" style="color:${vc}; background: var(--bg-card);">
    <div class="verdict-left">
      <div class="token-icon">${m.token_symbol}</div>
      <div class="token-info">
        <h1>Investment Memo: ${m.token_name}</h1>
        <div class="sub">${m.token_type} &middot; ${m.date} &middot; BSB Capital Research</div>
      </div>
    </div>
    <div class="verdict-right">
      <div class="verdict-label">Score Compuesto</div>
      <div class="verdict-value" style="color:${sc}">${m.composite_score}</div>
      <div class="verdict-score" style="color:${sc}">${m.conviction_tier}</div>
    </div>
  </div>`;

  // Render each section
  memo.sections.forEach(section => {
    html += renderMemoSection(section);

  // Scoring Summary Card
  html += `
  <div class="memo-section">
    <div class="memo-section-title">Resumen de Scoring Integrado</div>
    <div class="grid-3" style="margin-bottom:0">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Tokenomics (x0.30)</div>
        ${Object.entries(ss.tokenomics_dimensions).filter(([k]) => k !== 'weighted_total').map(([k, v]) =>
          `<div class="memo-kv"><span class="memo-key">${k.replace(/_/g,' ')}</span><span class="memo-val">${v.score}/${v.max}</span></div>`
        ).join('')}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
          <span style="font-weight:800;font-size:13px">TOTAL</span>
          <span style="font-weight:800;font-size:16px;color:${getScoreColor(ss.tokenomics_dimensions.weighted_total)}">${ss.tokenomics_dimensions.weighted_total}</span>
        </div>
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Cualitativo (x0.35)</div>
        ${Object.entries(ss.qualitative_dimensions).filter(([k]) => k !== 'weighted_total').map(([k, v]) =>
          `<div class="memo-kv"><span class="memo-key">${k.replace(/_/g,' ')}</span><span class="memo-val">${v.score}/100</span></div>`
        ).join('')}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
          <span style="font-weight:800;font-size:13px">TOTAL</span>
          <span style="font-weight:800;font-size:16px;color:${getScoreColor(ss.qualitative_dimensions.weighted_total)}">${ss.qualitative_dimensions.weighted_total}</span>
        </div>
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Cuantitativo (x0.35)</div>
        ${Object.entries(ss.quantitative_metrics).filter(([k]) => k !== 'weighted_total').map(([k, v]) =>
          `<div class="memo-kv"><span class="memo-key">${k.replace(/_/g,' ')}</span><span class="memo-val">${v.score}/100</span></div>`
        ).join('')}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
          <span style="font-weight:800;font-size:13px">TOTAL</span>
          <span style="font-weight:800;font-size:16px;color:${getScoreColor(ss.quantitative_metrics.weighted_total)}">${ss.quantitative_metrics.weighted_total}</span>
        </div>
      </div>
    </div>
    <div style="margin-top:20px;padding:20px;border-radius:12px;background:var(--bg-primary);text-align:center">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">FORMULA COMPUESTA</div>
      <div style="font-size:14px;color:var(--text-secondary)">
        <span style="color:var(--accent)">${ss.composite.tokenomics_weighted}</span> +
        <span style="color:var(--cyan)">${ss.composite.qualitative_weighted}</span> +
        <span style="color:var(--green)">${ss.composite.quantitative_weighted}</span> =
        <span style="font-size:24px;font-weight:800;color:${sc};margin-left:8px">${ss.composite.total}/100</span>

    </div>

  html += `<div class="disclaimer">${memo.disclaimer}</div>`;

  document.getElementById('content').innerHTML = html;
}

function renderMemoSection(section) {
  const c = section.content;
  let body = '';

  switch(section.id) {
    case 'executive_summary':
      body = `
        <div class="memo-text"><strong>Tesis:</strong> ${c.thesis}</div>
        <div class="grid-2" style="margin-top:16px;margin-bottom:0">
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">DRIVERS DE CONVICCION</div>
            <ul class="memo-list">${c.conviction_drivers.map(d => `<li>${d}</li>`).join('')}</ul>
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px">RIESGOS PRINCIPALES</div>
            <ul class="memo-list">${c.key_risks.map(r => `<li>${r}</li>`).join('')}</ul>
          </div>
        </div>
        <div style="margin-top:16px;display:flex;gap:16px;flex-wrap:wrap">
          <div class="stat-card" style="flex:1;min-width:100px"><div class="stat-label">Precio</div><div class="stat-value" style="font-size:18px">${c.price}</div></div>
          <div class="stat-card" style="flex:1;min-width:100px"><div class="stat-label">Market Cap</div><div class="stat-value" style="font-size:18px">${c.market_cap}</div></div>
          <div class="stat-card" style="flex:1;min-width:100px"><div class="stat-label">FDV</div><div class="stat-value" style="font-size:18px">${c.fdv}</div></div>
          <div class="stat-card" style="flex:1;min-width:100px"><div class="stat-label">Score</div><div class="stat-value" style="font-size:18px;color:${getScoreColor(c.composite_score)}">${c.composite_score}</div></div>
        </div>`;
      break;

    case 'market_context':
      body = `
        <div class="memo-text"><strong>Macro Tesis:</strong> ${c.macro_thesis}</div>
        <div style="margin-top:12px" class="memo-text"><strong>TAM:</strong> ${c.tam_analysis}</div>
        <div style="margin-top:12px" class="memo-text"><strong>Competencia:</strong> ${c.competitive_landscape}</div>
        <div style="margin-top:12px" class="memo-text"><strong>Regulacion:</strong> ${c.regulatory_context}</div>`;
      break;

    case 'protocol_deep_dive':
      body = `
        <div class="memo-text">${c.description}</div>
        <div style="margin-top:16px" class="memo-text"><strong>Arquitectura:</strong> ${c.architecture}</div>
        <div style="margin-top:16px">
          <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">EVIDENCIA DE PMF (Score: ${c.pmf_score}/100)</div>
          <ul class="memo-list">${c.pmf_evidence.map(e => `<li>${e}</li>`).join('')}</ul>
        </div>
        <div style="margin-top:16px;padding:16px;border-radius:10px;background:var(--bg-primary)">
          <div style="font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:8px">ANALISIS DE VELOCIDAD (Token Velocity Problem)</div>
          <div class="memo-text">${c.velocity_analysis.detail}</div>
          ${c.velocity_analysis.sinks.length > 0 ? '<div style="margin-top:8px;font-size:12px;color:var(--text-muted)"><strong>Velocity Sinks:</strong> ' + c.velocity_analysis.sinks.join(' | ') + '</div>' : ''}
        </div>
        <div style="margin-top:12px;padding:16px;border-radius:10px;background:var(--bg-primary)">
          <div style="font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:8px">ACUMULACION DE VALOR (Modelo: ${c.value_accrual.model})</div>
          <div class="memo-text">${c.value_accrual.detail}</div>
        </div>`;
      break;

    case 'tokenomics':
      body = `
        <div class="grid-2" style="margin-bottom:16px">
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px">SUPPLY</div>
            ${Object.entries(c.supply).map(([k,v]) => `<div class="memo-kv"><span class="memo-key">${k.replace(/_/g,' ')}</span><span class="memo-val">${v}</span></div>`).join('')}
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px">DISTRIBUCION</div>
            ${Object.entries(c.distribution).map(([k,v]) => `<div class="memo-kv"><span class="memo-key">${k.replace(/_/g,' ')}</span><span class="memo-val">${v}</span></div>`).join('')}
          </div>
        </div>
        <div style="padding:16px;border-radius:10px;background:var(--bg-primary);margin-bottom:16px">
          <div style="font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:8px">REAL YIELD (${c.real_yield.sustainability})</div>
          <div class="memo-text">${c.real_yield.detail}</div>
          <div style="margin-top:8px;display:flex;gap:16px;font-size:12px">
            <span>Revenue: <strong>${c.real_yield.protocol_revenue}</strong></span>
            <span>Emisiones: <strong>${c.real_yield.emissions_value}</strong></span>
            <span>Yield: <strong style="color:${c.real_yield.real_yield_pct.includes('-') ? 'var(--red)' : 'var(--green)'}">${c.real_yield.real_yield_pct}</strong></span>
          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px">SCORING 6D (${c.weighted_score}/100)</div>
        ${Object.entries(c.dimension_scores).map(([k,v]) =>
          `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
            <span style="width:110px;font-size:12px;color:var(--text-muted)">${k.replace(/_/g,' ')}</span>
            <div style="flex:1;height:6px;background:var(--bg-primary);border-radius:3px;overflow:hidden">
              <div style="width:${v.score/5*100}%;height:100%;background:${v.score >= 4 ? 'var(--green)' : v.score >= 3 ? 'var(--yellow)' : 'var(--red)'};border-radius:3px"></div>
            </div>
            <span style="width:30px;text-align:right;font-size:13px;font-weight:700">${v.score}</span>
          </div>`
        ).join('')}
        ${c.red_flags.triggered.length > 0 ? `
          <div style="margin-top:16px;padding:16px;border-radius:10px;background:var(--red-bg)">
            <div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px">RED FLAGS AUTO-DESCALIFICADORAS ${c.red_flags.disqualified ? '(DESCALIFICADO)' : ''}</div>
            <ul class="memo-list">${c.red_flags.triggered.map(f => `<li style="color:var(--red)">${f}</li>`).join('')}</ul>
          </div>` : ''}`;
      break;

    case 'team_evaluation':
      body = `
        <div class="grid-2" style="margin-bottom:0">
          <div>
            <div class="memo-kv"><span class="memo-key">Founders</span><span class="memo-val">${c.founders.join(', ')}</span></div>
            <div class="memo-kv"><span class="memo-key">Doxxed</span><span class="memo-val" style="color:${c.doxxed ? 'var(--green)' : 'var(--red)'}">${c.doxxed ? 'Si' : 'No'}</span></div>
            <div class="memo-kv"><span class="memo-key">Team Score</span><span class="memo-val" style="color:${getScoreColor(c.team_score)}">${c.team_score}/100</span></div>
            <div class="memo-kv"><span class="memo-key">Dev Activity</span><span class="memo-val">${c.dev_activity}/100</span></div>
            <div class="memo-kv"><span class="memo-key">Commits 30d</span><span class="memo-val">${c.commits_30d}</span></div>
            <div class="memo-kv"><span class="memo-key">Transparencia</span><span class="memo-val">${c.transparency}/100</span></div>
          </div>
          <div>
            <div class="memo-text"><strong>Evaluacion:</strong> ${c.assessment}</div>
            <div style="margin-top:12px" class="memo-text" style="font-size:12px">${c.doxxed_note}</div>
          </div>
        </div>`;
      break;

    case 'competitive_moats':
      body = `
        <div class="memo-text"><strong>Moat Score:</strong> <span style="color:${getScoreColor(c.moat_score)}">${c.moat_score}/100</span></div>
        <div style="margin-top:12px" class="memo-text">${c.moat_detail}</div>
        <div class="structural-grid" style="margin-top:16px">
          ${structItem('Moat de Liquidez', c.liquidity_moat)}
          ${structItem('Network Effects', c.network_effects)}
          ${structItem('Switching Costs', c.switching_costs)}
          ${structItem('Brand / Lindy', c.brand_lindy)}
        </div>
        <div style="margin-top:16px" class="memo-text">${c.composability_note}</div>
        ${c.tier1_vcs.length > 0 ? '<div style="margin-top:12px;font-size:12px;color:var(--text-muted)">Tier-1 VCs: <strong style="color:var(--green)">' + c.tier1_vcs.join(', ') + '</strong></div>' : ''}
        ${c.partners.length > 0 ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted)">Partners: <strong style="color:var(--cyan)">' + c.partners.join(', ') + '</strong></div>' : ''}`;
      break;

    case 'financial_model':
      body = `
        <div style="margin-bottom:16px;font-size:14px">Score Cuantitativo: <strong style="color:${getScoreColor(c.quantitative_score)}">${c.quantitative_score}/100</strong></div>
        ${Object.entries(c.metrics).map(([k,v]) =>
          `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <span style="width:140px;font-size:12px;color:var(--text-muted)">${k.replace(/_/g,' ')}</span>
            <div style="flex:1;height:6px;background:var(--bg-primary);border-radius:3px;overflow:hidden">
              <div style="width:${v.score}%;height:100%;background:${getScoreColor(v.score)};border-radius:3px"></div>
            </div>
            <span style="width:40px;text-align:right;font-size:13px;font-weight:700">${v.score}</span>
          </div>
          <div style="margin-left:152px;font-size:11px;color:var(--text-muted);margin-bottom:12px">${v.detail}</div>`
        ).join('')}`;
      break;

    case 'risk_analysis':
      body = `
        <div style="margin-bottom:16px">Risk Score: <strong style="color:${getScoreColor(c.overall_risk_score)}">${c.overall_risk_score}/100</strong> (mayor = mas seguro)</div>
        <div class="flag-list" style="margin-bottom:16px">
          ${c.red_flags.map(f => flagItem('red', '&#9888;', f.category, f.description)).join('')}
          ${c.yellow_flags.map(f => flagItem('yellow', '&#9888;', f.category, f.description)).join('')}
          ${c.green_flags.map(f => flagItem('green', '&#10003;', f.category, f.description)).join('')}
        </div>
        <div class="grid-2" style="margin-bottom:0">
          ${Object.entries(c.risk_categories).map(([k,v]) => `
            <div style="padding:12px 16px;border-radius:10px;background:var(--bg-primary);margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                <span style="font-size:12px;font-weight:700;color:var(--text-secondary)">${k.replace(/_/g,' ').toUpperCase()}</span>
                <span style="font-size:12px;font-weight:700;color:var(--${v.level === 'bajo' || v.level === 'low' ? 'green' : v.level === 'alto' || v.level === 'high' || v.level === 'critical' ? 'red' : 'yellow'})">${v.level.toUpperCase()}</span>
              </div>
              <div style="font-size:11px;color:var(--text-muted);line-height:1.5">${v.detail}</div>
            </div>
          `).join('')}
        </div>`;
      break;

    case 'scenarios':
      const scenarios = [
        { key: 'bull', label: 'BULL CASE', color: 'var(--green)', data: c.bull },
        { key: 'base', label: 'BASE CASE', color: 'var(--yellow)', data: c.base },
        { key: 'bear', label: 'BEAR CASE', color: 'var(--red)', data: c.bear },
      ];
      body = `
        <div class="grid-3" style="margin-bottom:16px">
          ${scenarios.map(s => `
            <div class="scenario-card">
              <div class="scenario-title" style="color:${s.color}">${s.label}</div>
              <div class="sc-row"><span>Probabilidad</span><strong>${s.data.probability}</strong></div>
              <div class="sc-row"><span>Target</span><strong style="color:${s.color}">${s.data.target_price}</strong></div>
              <div class="sc-row"><span>Multiplicador</span><strong>${s.data.multiplier}</strong></div>
              <div style="margin-top:8px;font-size:11px;color:var(--text-muted)">
                ${s.data.assumptions.map(a => '<div style="margin-bottom:4px">- ' + a + '</div>').join('')}
              </div>
            </div>
          `).join('')}
        </div>
        <div style="padding:16px;border-radius:10px;background:var(--bg-primary);text-align:center">
          <span style="font-size:12px;color:var(--text-muted)">RETORNO ESPERADO PONDERADO: </span>
          <span style="font-size:20px;font-weight:800;color:${c.expected_return.includes('+') ? 'var(--green)' : 'var(--red)'}">${c.expected_return}</span>
          <span style="font-size:14px;color:var(--text-muted);margin-left:8px">(${c.expected_multiplier})</span>
        </div>`;
      break;

    case 'recommendation':
      body = `
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:48px;font-weight:900;color:${getScoreColor(c.composite_score)}">${c.composite_score}</div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:4px">${c.conviction_tier} &middot; ${c.verdict}</div>
        </div>
        <div style="margin-bottom:16px" class="memo-text">${c.formula}</div>
        <div class="grid-2" style="margin-bottom:16px">
          <div class="stat-card"><div class="stat-label">Position Sizing</div><div class="stat-value" style="font-size:16px">${c.position_sizing}</div></div>
          <div class="stat-card"><div class="stat-label">Entry Strategy</div><div class="stat-value" style="font-size:16px">${c.entry_strategy}</div></div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px">CRITERIOS DE SALIDA</div>
        <ul class="memo-list">${c.exit_criteria.map(e => `<li>${e}</li>`).join('')}</ul>`;
      break;

    default:
      body = `<div class="memo-text">${JSON.stringify(c, null, 2)}</div>`;
  }

  return `<div class="memo-section">
    <div class="memo-section-title">${section.title}</div>
    ${body}
  </div>`;
}


/* ====================================================================
   SHARED HELPERS
   ==================================================================== */
function scoreBar(label, score) {
  const c = getScoreColor(score);
  return `<div class="score-bar-row">
    <div class="score-bar-label">${label}</div>
    <div class="score-bar-track"><div class="score-bar-fill" style="width:${score}%;background:${c}"></div></div>
    <div class="score-bar-value" style="color:${c}">${score}</div>
  </div>`;
}

function indicatorRow(name, value, color, signal) {
  const colors = { green: 'var(--green)', red: 'var(--red)', yellow: 'var(--yellow)' };
  const bgs = { green: 'var(--green-bg)', red: 'var(--red-bg)', yellow: 'var(--yellow-bg)' };
  return `<div class="indicator-row">
    <div class="ind-name">${name}</div>
    <div class="ind-value" style="color:${colors[color] || 'var(--text-primary)'}">${value}</div>
    ${signal ? '<div class="ind-signal" style="background:' + (bgs[color]||'transparent') + ';color:' + (colors[color]||'var(--text-secondary)') + '">' + signal + '</div>' : ''}
  </div>`;
}

function legendItem(color, label, pct) {
  return `<div class="legend-item">
    <div class="legend-dot" style="background:${color}"></div>
    <span>${label}</span>
    <span class="legend-pct">${pct}%</span>
  </div>`;
}

function flagItem(type, icon, cat, desc) {
  return `<div class="flag-item ${type}">
    <span class="flag-icon">${icon}</span>
    <div><span class="flag-cat">[${cat}]</span> ${desc}</div>
  </div>`;
}

function structItem(label, value) {
  const color = value ? 'var(--red)' : 'var(--green)';
  return `<div class="structural-item">
    <span class="struct-label">${label}</span>
    <span class="struct-val" style="color:${color}">${value ? 'SI' : 'NO'}</span>
  </div>`;
}

function renderPriceChart(chart) {
  if (priceChart) priceChart.destroy();
  const ctx = document.getElementById('priceChart').getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 260);
  gradient.addColorStop(0, 'rgba(59,130,246,0.25)');
  gradient.addColorStop(1, 'rgba(59,130,246,0)');
  priceChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: chart.dates,
      datasets: [{
        data: chart.prices,
        borderColor: '#3b82f6', borderWidth: 2,
        backgroundColor: gradient, fill: true,
        pointRadius: 0, tension: 0.3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: true, grid: { color: 'rgba(42,53,80,0.3)' }, ticks: { color: '#64748b', maxTicksLimit: 6, font: { size: 10 } } },
        y: { display: true, grid: { color: 'rgba(42,53,80,0.3)' }, ticks: { color: '#64748b', font: { size: 10 } } },
      },
      interaction: { intersect: false, mode: 'index' },
    }
  });
}

function renderDistChart(tok) {
  if (distChart) distChart.destroy();
  const ctx = document.getElementById('distChart').getContext('2d');
  const labels = []; const data = []; const colors = [];
  const items = [
    ['Comunidad', tok.community_pct, '#10b981'],
    ['Equipo', tok.team_pct, '#3b82f6'],
    ['Inversores', tok.investor_pct, '#8b5cf6'],
    ['Ecosistema', tok.ecosystem_pct, '#06b6d4'],
    ['Tesoreria', tok.treasury_pct, '#f59e0b'],
    ['Otros', tok.other_pct, '#64748b'],
  ];
  items.forEach(([l,v,c]) => { if(v > 0) { labels.push(l); data.push(v); colors.push(c); }});
  distChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: true, cutout: '65%',
      plugins: { legend: { display: false } },
    }
  });
}

// Auto-load token from URL hash or default to ethereum
window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.replace('#', '');
  const token = ['ethereum','bitcoin','solana','arbitrum'].includes(hash) ? hash : 'ethereum';
  loadToken(token);
});
</script>
